<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamTasks - Team Task Management</title>
  <style>
    :root {
      --bg-page: #EAF2FB;
      --card-bg: #FFFFFF;
      --navy: #16264A;
      --navy-2: #1E293B;
      --label-gray: #8A94A6;
      --border-soft: #E4ECF7;
      --teal: #14B8C6;
      --teal-dark: #0FA0AD;
      --good: #159957;
      --bad: #DC2626;
      --purple: #7C5CFC;
      --orange: #F59E0B;
      --green: #22C55E;
      --red: #EF4444;
      --slate: #64748B;
      --indigo: #6366F1;
      --pending: #D9A400;
      --approved: #159957;
      --rejected: #DC2626;
      --shadow-sm: 0 1px 3px rgba(20,50,90,0.06);
      --shadow-md: 0 4px 16px rgba(20,50,90,0.08);
      --shadow-lg: 0 10px 30px rgba(20,50,90,0.14);
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      color: var(--navy);
      min-height: 100vh;
      background: var(--bg-page);
    }

    .app { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ===== HEADER ===== */
    .header {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .header-right { display: flex; align-items: center; gap: 14px; }

    .avatar-circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--sans);
    }

    .btn-primary {
      background: var(--teal);
      color: white;
      padding: 12px 22px;
      box-shadow: 0 4px 12px rgba(20,184,198,0.35);
    }

    .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }

    .btn-save { background: var(--green); color: white; padding: 10px 20px; }
    .btn-cancel { background: #F1F5F9; color: var(--slate); padding: 10px 20px; }
    .btn-delete { background: #FEE2E2; color: var(--red); padding: 10px 20px; }
    .btn-approve { background: var(--green); color: white; padding: 8px 16px; }
    .btn-reject { background: var(--red); color: white; padding: 8px 16px; }
    .btn-small { padding: 7px 14px; font-size: 12px; }
    .btn-outline { background: #F1F5F9; color: var(--slate); padding: 7px 14px; }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }

    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stat-icon svg { width: 22px; height: 22px; }

    .stat-label {
      font-size: 11px;
      color: var(--label-gray);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-number {
      font-size: 34px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-caption { font-size: 12px; font-weight: 600; }
    .stat-caption.good { color: var(--good); }
    .stat-caption.bad { color: var(--bad); }

    /* ===== KANBAN BOARD ===== */
    .board {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      align-items: flex-start;
      padding-bottom: 12px;
    }

    .column {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      min-width: 270px;
      width: 270px;
      flex: 1 1 270px;
      padding: 18px;
      transition: flex-basis 0.2s ease, min-width 0.2s ease, width 0.2s ease;
    }

    .column.column-collapsed {
      flex: 0 0 120px;
      min-width: 120px;
      width: 120px;
      padding: 14px 10px;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .column-header span:first-child {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
    }

    .column.column-collapsed .column-header {
      flex-direction: row;
      white-space: nowrap;
      overflow: hidden;
    }

    .column.column-collapsed .column-header span:first-child {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .column-count {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .column-body { min-height: 80px; display: flex; flex-direction: column; gap: 12px; }
    .column.column-collapsed .column-body { display: none; }

    .column.drag-over {
      box-shadow: 0 0 0 2px var(--teal), var(--shadow-md);
      background: #F0FBFC;
    }

    /* ===== TASK CARDS ===== */
    .task-card {
      background: var(--card-bg);
      border-radius: 12px;
      border-left: 4px solid var(--slate);
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .task-card.dragging { opacity: 0.5; }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--navy);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-code { font-size: 11px; color: var(--label-gray); margin-bottom: 10px; }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-tagged {
      font-size: 11px;
      color: var(--label-gray);
      margin-bottom: 8px;
    }

    .card-date {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--slate);
    }

    .card-date.overdue { color: var(--bad); font-weight: 700; }
    .card-date svg { width: 13px; height: 13px; flex-shrink: 0; }

    .bar-icon { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .bar-icon span { width: 3px; border-radius: 1px; background: #E2E8F0; }
    .bar-icon span.fill { background: currentColor; }
    .bar-icon span:nth-child(1) { height: 6px; }
    .bar-icon span:nth-child(2) { height: 10px; }
    .bar-icon span:nth-child(3) { height: 14px; }

    .approval-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .approval-badge.pending { background: #FDF0C6; color: #8A6A00; }
    .approval-badge.approved { background: #D4F3E1; color: #0F6B3C; }
    .approval-badge.rejected { background: #FBDADA; color: #A11616; }

    .card-icons { display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--label-gray); }

    .card-creator {
      font-size: 10px;
      color: var(--label-gray);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-soft);
    }

    .empty-hint {
      text-align: center;
      font-size: 11px;
      color: var(--label-gray);
      padding: 20px 8px;
      border: 1.5px dashed var(--border-soft);
      border-radius: 10px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(22,38,74,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--card-bg);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: var(--shadow-lg);
    }

    .modal h2 { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: var(--navy); }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--label-gray);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--sans);
      background: #F8FBFE;
      color: var(--navy);
    }

    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--teal);
      background: white;
    }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }

    .readonly-info {
      font-size: 12px;
      color: var(--label-gray);
      background: #F8FBFE;
      border: 1px solid var(--border-soft);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .approval-section {
      display: none;
      background: #FEFAEC;
      border: 1.5px solid #F3E2A6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .approval-section.show { display: block; }

    .approval-status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--navy); }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .status-dot.pending { background: var(--pending); }
    .status-dot.approved { background: var(--approved); }
    .status-dot.rejected { background: var(--rejected); }
    .approval-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .voice-slot {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #F8FBFE;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .voice-slot audio { flex: 1; min-width: 160px; height: 34px; }

    .rec-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--red);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--red);
      background: white;
      flex-shrink: 0;
    }

    .rec-btn.recording { background: var(--red); color: white; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
    }

    .voice-empty { font-size: 12px; color: var(--label-gray); }
    .voice-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; }

    .attach-dropzone {
      border: 1.5px dashed var(--border-soft);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--label-gray);
      cursor: pointer;
      margin-bottom: 10px;
      background: #F8FBFE;
    }

    .attach-dropzone:hover { border-color: var(--teal); color: var(--teal-dark); }
    .attach-list { display: flex; flex-direction: column; gap: 8px; }

    .attach-item { display: flex; align-items: center; gap: 10px; background: #F8FBFE; border: 1.5px solid var(--border-soft); border-radius: 10px; padding: 8px 10px; }
    .attach-thumb { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--border-soft); flex-shrink: 0; }

    .attach-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .attach-name {
      flex: 1;
      font-size: 12px;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .attach-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; flex-shrink: 0; }

    @media (max-width: 768px) {
      .app { padding: 14px; }
      .header { padding: 16px 18px; border-radius: 16px; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="app">

    <div class="header">
      <h1>TeamTasks</h1>
      <div class="header-right">
        <button class="btn btn-primary" onclick="openAddModal()">+ New Task</button>
        <div class="avatar-circle" id="headerAvatar" style="background:#6366F1;">MA</div>
      </div>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="board" id="board"></div>

  </div>

  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="modalTitle">New Task</h2>
      <div class="readonly-info" id="createdByInfo" style="display:none;"></div>

      <div class="form-group">
        <label>Task Name *</label>
        <input type="text" id="fName" placeholder="Enter task name">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="fDesc" placeholder="Describe the task..."></textarea>
      </div>

      <div class="form-group">
        <label>Assigned To</label>
        <select id="fAssigned">
          <option value="Manager Admin">Manager Admin</option>
          <option value="John">John</option>
          <option value="Sarah">Sarah</option>
          <option value="Alex">Alex</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tag for Help (optional)</label>
        <select id="fTagged" multiple size="4">
          <option value="Manager Admin">Manager Admin</option>
          <option value="John">John</option>
          <option value="Sarah">Sarah</option>
          <option value="Alex">Alex</option>
        </select>
      </div>

      <div class="form-group">
        <label>Deadline</label>
        <input type="date" id="fDeadline">
      </div>

      <div class="form-group">
        <label>Urgency</label>
        <select id="fUrgency">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="fStatus" onchange="onStatusChange()">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="approval">Approval</option>
          <option value="done">Done</option>
          <option value="need-help">Need Help</option>
          <option value="hold">Hold</option>
          <option value="future">Future</option>
        </select>
      </div>

      <div class="approval-section" id="approvalSection">
        <div class="form-group" style="margin-bottom:10px;">
          <label>Tagged for Approval</label>
          <select id="fApprover" disabled>
            <option>Manager Admin</option>
          </select>
        </div>
        <div class="approval-status-line">
          <span class="status-dot" id="approvalDot"></span>
          <span id="approvalStatusText">Pending</span>
        </div>
        <div class="approval-buttons">
          <button type="button" class="btn btn-approve btn-small" onclick="setApproval('approved')">Approve</button>
          <button type="button" class="btn btn-reject btn-small" onclick="setApproval('rejected')">Reject</button>
          <button type="button" class="btn btn-outline btn-small" onclick="setApproval('pending')">Reset to Pending</button>
        </div>
      </div>

      <div class="form-group">
        <label>Voice Notes (up to 2)</label>
        <div id="voiceSlot0"></div>
        <div id="voiceSlot1"></div>
      </div>

      <div class="form-group">
        <label>Attachments (image, video, doc — up to 4)</label>
        <div class="attach-dropzone" onclick="document.getElementById('fileInput').click()">
          Click to add files (<span id="attachCount">0</span>/4)
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.txt" style="display:none" onchange="handleFiles(this.files)">
        <div class="attach-list" id="attachList"></div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-delete" id="deleteBtn" style="display:none;" onclick="deleteTask()">Delete</button>
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-save" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    const STATUSES = [
      { key: 'todo', label: 'To Do', color: '#7C5CFC' },
      { key: 'in-progress', label: 'In Progress', color: '#F59E0B' },
      { key: 'approval', label: 'Approval', color: '#14B8C6' },
      { key: 'done', label: 'Done', color: '#22C55E' },
      { key: 'need-help', label: 'Need Help', color: '#EF4444' },
      { key: 'hold', label: 'Hold', color: '#64748B' },
      { key: 'future', label: 'Future', color: '#6366F1' }
    ];
    const STATUS_COLOR = Object.fromEntries(STATUSES.map(s => [s.key, s.color]));

    const AVATAR_COLORS = ['#6366F1', '#F59E0B', '#14B8C6', '#EF4444', '#22C55E', '#7C5CFC'];

    const ICONS = {
      total: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      inProgress: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
      done: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      approval: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/></svg>',
      overdue: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M12 14v3M12 20h.01"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
    };

    let tasks = [];
    let editingId = null;

    let tempVoiceNotes = [null, null];
    let tempAttachments = [];
    let tempApproval = 'pending';
    let mediaRecorder = null;
    let recordingSlot = null;
    let recordedChunks = [];
    let taskCounter = 100;

    function init() {
      const saved = localStorage.getItem('teamtasks_data');
      if (saved) {
        tasks = JSON.parse(saved);
      } else {
        tasks = [
          { id: 1, code: 'T-101', name: 'Design Dashboard UI', desc: 'Create modern mockups', assigned: 'John', tagged: ['Sarah'], deadline: '2026-08-28', urgency: 'high', status: 'in-progress', createdBy: 'Manager Admin', voiceNotes: [null, null], attachments: [] },
          { id: 2, code: 'T-102', name: 'Setup Database', desc: 'Configure data storage', assigned: 'Alex', tagged: [], deadline: '2026-08-25', urgency: 'high', status: 'todo', createdBy: 'Manager Admin', voiceNotes: [null, null], attachments: [] },
          { id: 3, code: 'T-103', name: 'Write Documentation', desc: 'User guide for the team', assigned: 'Sarah', tagged: [], deadline: '2026-09-05', urgency: 'low', status: 'future', createdBy: 'Manager Admin', voiceNotes: [null, null], attachments: [] },
          { id: 4, code: 'T-104', name: 'Marketing Budget Approval', desc: 'Q4 campaign budget sign-off', assigned: 'John', tagged: [], deadline: '2026-08-24', urgency: 'medium', status: 'approval', approvalStatus: 'pending', createdBy: 'John', voiceNotes: [null, null], attachments: [] }
        ];
        persist();
      }
      const codes = tasks.map(t => t.code).filter(Boolean).map(c => parseInt(c.replace('T-', ''), 10)).filter(n => !isNaN(n));
      taskCounter = codes.length ? Math.max(...codes) : 100;
      render();
    }

    function persist() {
      localStorage.setItem('teamtasks_data', JSON.stringify(tasks));
    }

    function render() {
      renderStats();
      renderBoard();
    }

    function initials(name) {
      return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function avatarColor(name) {
      let sum = 0;
      for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
      return AVATAR_COLORS[sum % AVATAR_COLORS.length];
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderStats() {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'done').length;
      const inProgress = tasks.filter(t => t.status === 'in-progress').length;
      const pendingApproval = tasks.filter(t => t.status === 'approval' && (t.approvalStatus || 'pending') === 'pending').length;
      const overdue = tasks.filter(t => t.deadline && t.deadline < today() && t.status !== 'done').length;

      const cards = [
        { icon: ICONS.total, label: 'Total Tasks', value: total, caption: `Across all statuses`, good: true },
        { icon: ICONS.inProgress, label: 'In Progress', value: inProgress, caption: inProgress ? `${inProgress} being worked on` : 'Nothing active', good: true },
        { icon: ICONS.done, label: 'Completed', value: done, caption: done ? `${done} finished` : 'None yet', good: true },
        { icon: ICONS.approval, label: 'Awaiting Approval', value: pendingApproval, caption: pendingApproval ? `Needs manager review` : 'All clear', good: !pendingApproval },
        { icon: ICONS.overdue, label: 'Overdue', value: overdue, caption: overdue ? `${overdue} need attention` : 'None, great job!', good: !overdue }
      ];

      document.getElementById('statsBar').innerHTML = cards.map(c => `
        <div class="stat-card">
          <div class="stat-icon">${c.icon}</div>
          <div class="stat-label">${c.label}</div>
          <div class="stat-number">${c.value}</div>
          <div class="stat-caption ${c.good ? 'good' : 'bad'}">${c.caption}</div>
        </div>
      `).join('');
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      STATUSES.forEach(s => {
        const colTasks = tasks.filter(t => t.status === s.key);
        const isEmpty = colTasks.length === 0;
        const col = document.createElement('div');
        col.className = 'column' + (isEmpty ? ' column-collapsed' : '');
        col.dataset.status = s.key;

        col.innerHTML = `
          <div class="column-header">
            <span>${s.label}</span>
            <span class="column-count">${colTasks.length}</span>
          </div>
          <div class="column-body" data-status="${s.key}">
            ${isEmpty ? '<div class="empty-hint">Drop tasks here</div>' : ''}
          </div>
        `;

        const body = col.querySelector('.column-body');
        colTasks.forEach(t => body.appendChild(makeCard(t)));

        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const id = parseInt(e.dataTransfer.getData('text/plain'));
          const task = tasks.find(t => t.id === id);
          if (task && task.status !== s.key) {
            task.status = s.key;
            if (s.key === 'approval' && !task.approvalStatus) {
              task.approvalStatus = 'pending';
            }
            persist();
            render();
          }
        });

        board.appendChild(col);
      });
    }

    function urgencyBarIcon(urgency) {
      const level = urgency === 'high' ? 3 : urgency === 'medium' ? 2 : 1;
      const color = urgency === 'high' ? 'var(--red)' : urgency === 'medium' ? 'var(--orange)' : 'var(--green)';
      let bars = '';
      for (let i = 1; i <= 3; i++) {
        bars += `<span class="${i <= level ? 'fill' : ''}"></span>`;
      }
      return `<div class="bar-icon" style="color:${color}">${bars}</div>`;
    }

    function makeCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.style.borderLeftColor = STATUS_COLOR[task.status] || '#64748B';
      card.draggable = true;

      const isOverdue = task.deadline && task.deadline < today() && task.status !== 'done';
      const taggedHtml = task.tagged && task.tagged.length
        ? `<div class="card-tagged">🏷️ ${esc(task.tagged.join(', '))}</div>` : '';

      const voiceCount = (task.voiceNotes || []).filter(Boolean).length;
      const fileCount = (task.attachments || []).length;
      const iconsHtml = (voiceCount || fileCount)
        ? `<div class="card-icons">${voiceCount ? `🎙️ ${voiceCount}` : ''} ${fileCount ? `📎 ${fileCount}` : ''}</div>` : '';

      const approvalBadge = task.status === 'approval'
        ? `<span class="approval-badge ${task.approvalStatus || 'pending'}">${task.approvalStatus || 'pending'}</span>` : '';

      const av = initials(task.assigned || '?');
      const avColor = avatarColor(task.assigned || '?');

      card.innerHTML = `
        ${approvalBadge}
        <div class="card-title">${esc(task.name)}</div>
        <div class="card-code">${esc(task.code || '')}</div>
        <div class="card-row">
          <div class="card-date ${isOverdue ? 'overdue' : ''}">${ICONS.calendar} ${task.deadline ? formatDate(task.deadline) : 'No date'}</div>
          <div class="avatar-circle" style="width:26px;height:26px;font-size:10px;background:${avColor}">${av}</div>
        </div>
        <div class="card-row" style="margin-bottom:0;">
          ${taggedHtml || '<span></span>'}
          ${urgencyBarIcon(task.urgency)}
        </div>
        ${iconsHtml}
        <div class="card-creator">Created by ${esc(task.createdBy)}</div>
      `;

      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', task.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('click', () => openEditModal(task.id));

      return card;
    }

    function openAddModal() {
      editingId = null;
      tempVoiceNotes = [null, null];
      tempAttachments = [];
      tempApproval = 'pending';

      document.getElementById('modalTitle').textContent = 'New Task';
      document.getElementById('createdByInfo').style.display = 'none';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('fName').value = '';
      document.getElementById('fDesc').value = '';
      document.getElementById('fAssigned').value = 'Manager Admin';
      clearMultiSelect('fTagged');
      document.getElementById('fDeadline').value = '';
      document.getElementById('fUrgency').value = 'medium';
      document.getElementById('fStatus').value = 'todo';

      renderVoiceSlots();
      renderAttachments();
      onStatusChange();
      document.getElementById('taskModal').classList.add('show');
    }

    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      editingId = id;
      tempVoiceNotes = (task.voiceNotes && task.voiceNotes.length === 2) ? [...task.voiceNotes] : [null, null];
      tempAttachments = task.attachments ? [...task.attachments] : [];
      tempApproval = task.approvalStatus || 'pending';

      document.getElementById('modalTitle').textContent = 'Edit Task';
      const info = document.getElementById('createdByInfo');
      info.style.display = 'block';
      info.textContent = `${task.code || ''} — Created by: ${task.createdBy}`;
      document.getElementById('deleteBtn').style.display = 'inline-block';
      document.getElementById('fName').value = task.name;
      document.getElementById('fDesc').value = task.desc || '';
      document.getElementById('fAssigned').value = task.assigned;
      setMultiSelect('fTagged', task.tagged || []);
      document.getElementById('fDeadline').value = task.deadline || '';
      document.getElementById('fUrgency').value = task.urgency;
      document.getElementById('fStatus').value = task.status;

      renderVoiceSlots();
      renderAttachments();
      onStatusChange();
      document.getElementById('taskModal').classList.add('show');
    }

    function closeModal() {
      stopRecordingIfActive();
      document.getElementById('taskModal').classList.remove('show');
      editingId = null;
    }

    function saveTask() {
      const name = document.getElementById('fName').value.trim();
      if (!name) { alert('Please enter a task name'); return; }

      const status = document.getElementById('fStatus').value;

      const data = {
        name,
        desc: document.getElementById('fDesc').value.trim(),
        assigned: document.getElementById('fAssigned').value,
        tagged: getMultiSelect('fTagged'),
        deadline: document.getElementById('fDeadline').value,
        urgency: document.getElementById('fUrgency').value,
        status,
        voiceNotes: tempVoiceNotes,
        attachments: tempAttachments
      };

      if (status === 'approval') {
        data.approvalStatus = tempApproval || 'pending';
      }

      if (editingId) {
        const task = tasks.find(t => t.id === editingId);
        Object.assign(task, data);
      } else {
        taskCounter++;
        tasks.push({ id: Date.now(), code: 'T-' + taskCounter, createdBy: 'Manager Admin', ...data });
      }

      persist();
      render();
      closeModal();
    }

    function deleteTask() {
      if (!editingId) return;
      if (!confirm('Delete this task?')) return;
      tasks = tasks.filter(t => t.id !== editingId);
      persist();
      render();
      closeModal();
    }

    function onStatusChange() {
      const status = document.getElementById('fStatus').value;
      const section = document.getElementById('approvalSection');
      if (status === 'approval') {
        section.classList.add('show');
        updateApprovalUI();
      } else {
        section.classList.remove('show');
      }
    }

    function setApproval(value) {
      tempApproval = value;
      updateApprovalUI();
    }

    function updateApprovalUI() {
      const dot = document.getElementById('approvalDot');
      const text = document.getElementById('approvalStatusText');
      dot.className = `status-dot ${tempApproval}`;
      text.textContent = tempApproval.charAt(0).toUpperCase() + tempApproval.slice(1);
    }

    function renderVoiceSlots() {
      for (let i = 0; i < 2; i++) {
        const container = document.getElementById('voiceSlot' + i);
        const note = tempVoiceNotes[i];

        if (note) {
          container.innerHTML = `
            <div class="voice-slot">
              <span>🎙️ Note ${i + 1}</span>
              <audio controls src="${note}"></audio>
              <button type="button" class="voice-remove" onclick="removeVoiceNote(${i})" title="Delete">🗑️</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="voice-slot">
              <button type="button" class="rec-btn" id="recBtn${i}" onclick="toggleRecording(${i})" title="Record">🎤</button>
              <span class="voice-empty">Voice note ${i + 1} — not recorded</span>
            </div>
          `;
        }
      }
    }

    async function toggleRecording(slot) {
      if (recordingSlot === slot) {
        mediaRecorder.stop();
        return;
      }
      if (recordingSlot !== null) {
        alert('Please stop the current recording first.');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        recordingSlot = slot;

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            tempVoiceNotes[slot] = reader.result;
            renderVoiceSlots();
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
          recordingSlot = null;
        };

        mediaRecorder.start();
        const btn = document.getElementById('recBtn' + slot);
        if (btn) { btn.classList.add('recording'); btn.textContent = '⏹️'; }
      } catch (err) {
        alert('Microphone access denied or unavailable: ' + err.message);
        recordingSlot = null;
      }
    }

    function stopRecordingIfActive() {
      if (mediaRecorder && recordingSlot !== null) {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      recordingSlot = null;
    }

    function removeVoiceNote(slot) {
      tempVoiceNotes[slot] = null;
      renderVoiceSlots();
    }

    function handleFiles(fileList) {
      const files = Array.from(fileList);
      const remaining = 4 - tempAttachments.length;

      if (remaining <= 0) {
        alert('Maximum 4 attachments allowed.');
        document.getElementById('fileInput').value = '';
        return;
      }

      const toAdd = files.slice(0, remaining);
      if (files.length > remaining) {
        alert(`Only ${remaining} more file(s) can be added (max 4 total).`);
      }

      let loaded = 0;
      toAdd.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          tempAttachments.push({
            name: file.name,
            type: file.type,
            data: reader.result
          });
          loaded++;
          if (loaded === toAdd.length) {
            renderAttachments();
          }
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('fileInput').value = '';
    }

    function removeAttachment(index) {
      tempAttachments.splice(index, 1);
      renderAttachments();
    }

    function renderAttachments() {
      document.getElementById('attachCount').textContent = tempAttachments.length;
      const list = document.getElementById('attachList');
      list.innerHTML = '';

      tempAttachments.forEach((att, i) => {
        const item = document.createElement('div');
        item.className = 'attach-item';

        const isImage = att.type && att.type.startsWith('image/');
        const icon = isImage
          ? `<img class="attach-thumb" src="${att.data}">`
          : `<div class="attach-icon">${fileIcon(att.type)}</div>`;

        item.innerHTML = `
          ${icon}
          <span class="attach-name">${esc(att.name)}</span>
          <button type="button" class="attach-remove" onclick="removeAttachment(${i})" title="Remove">🗑️</button>
        `;
        item.querySelector('.attach-name').addEventListener('click', () => {
          window.open(att.data, '_blank');
        });
        list.appendChild(item);
      });
    }

    function fileIcon(type) {
      if (!type) return '📄';
      if (type.startsWith('video/')) return '🎬';
      if (type.includes('pdf')) return '📕';
      if (type.includes('word') || type.includes('doc')) return '📝';
      return '📄';
    }

    function today() {
      return new Date().toISOString().split('T')[0];
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function getMultiSelect(id) {
      return Array.from(document.getElementById(id).selectedOptions).map(o => o.value);
    }

    function setMultiSelect(id, values) {
      Array.from(document.getElementById(id).options).forEach(o => {
        o.selected = values.includes(o.value);
      });
    }

    function clearMultiSelect(id) {
      Array.from(document.getElementById(id).options).forEach(o => o.selected = false);
    }

    document.getElementById('taskModal').addEventListener('click', e => {
      if (e.target.id === 'taskModal') closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
