<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TeamTasks - Team Task Management</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root {
      --bg-page: #EAF2FB;
      --card-bg: #FFFFFF;
      --navy: #16264A;
      --navy-2: #1E293B;
      --label-gray: #8A94A6;
      --border-soft: #E4ECF7;
      --teal: #14B8C6;
      --teal-dark: #0FA0AD;
      --good: #159957;
      --bad: #DC2626;
      --purple: #7C5CFC;
      --orange: #F59E0B;
      --green: #22C55E;
      --red: #EF4444;
      --slate: #64748B;
      --indigo: #6366F1;
      --pending: #D9A400;
      --approved: #159957;
      --rejected: #DC2626;
      --shadow-sm: 0 1px 3px rgba(20,50,90,0.06);
      --shadow-md: 0 4px 16px rgba(20,50,90,0.08);
      --shadow-lg: 0 10px 30px rgba(20,50,90,0.14);
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      color: var(--navy);
      min-height: 100vh;
      background: var(--bg-page);
    }

    .app { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ===== LOGIN SCREEN ===== */
    .login-screen {
      min-height: 100vh;
      display: flex;
    }

    .login-left {
      flex: 1 1 50%;
      background-image: url('assets/login-left-panel.png');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }

    .login-right {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
      position: relative;
      background-image:
        linear-gradient(180deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.88) 100%),
        url('assets/bg-pattern.png');
      background-size: cover;
      background-position: center;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(240, 244, 249, 0.6);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .login-logo { display: none; }

    .login-title {
      font-size: 30px;
      font-weight: 800;
      color: var(--navy);
      text-align: left;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }

    .login-subtitle { display: none; }

    .login-field {
      width: 100%;
      padding: 15px 18px;
      border: 1.5px solid #C7D2E0;
      border-radius: 12px;
      font-size: 16px;
      font-family: var(--sans);
      background: rgba(255,255,255,0.5);
      color: var(--navy);
      margin-bottom: 18px;
    }

    .login-field:focus {
      outline: none;
      border-color: var(--teal);
      background: white;
    }

    .login-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .login-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--navy);
      font-weight: 600;
    }

    .login-remember input { width: 16px; height: 16px; accent-color: var(--teal); cursor: pointer; }

    .login-forgot {
      color: var(--teal-dark);
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 13px;
      font-family: var(--sans);
    }

    .login-forgot:hover { text-decoration: underline; }

    .login-submit {
      width: 100%;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--sans);
      box-shadow: 0 8px 20px rgba(20,184,198,0.35);
      transition: background 0.15s ease;
    }

    .login-submit:hover { background: var(--teal-dark); }

    .login-error {
      display: none;
      background: #FEE2E2;
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .login-error.show { display: block; }

    .login-hint-toggle {
      text-align: center;
      font-size: 12px;
      color: var(--teal-dark);
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .login-hint-toggle:hover { text-decoration: underline; }

    .login-hint {
      display: none;
      margin-top: 12px;
      background: #F8FBFE;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .login-hint.show { display: block; }

    .login-hint-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      color: var(--navy);
    }

    .login-hint-row span:last-child { color: var(--label-gray); font-family: monospace; }

    /* ===== HEADER ===== */
    .header {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      height: 40px;
      width: auto;
      flex-shrink: 0;
      object-fit: contain;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
      margin: 0;
    }

    .header-right { display: flex; align-items: center; gap: 14px; }

    .avatar-circle {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .team-trigger-wrap { position: relative; }

    .team-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1F5F9;
      border: none;
      border-radius: 999px;
      padding: 6px 12px 6px 6px;
      cursor: pointer;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
    }

    .team-trigger:hover { background: #E4ECF7; }
    .team-trigger .chev { color: var(--label-gray); font-size: 10px; }

    .logout-icon-btn {
      background: #F1F5F9;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      cursor: pointer;
      font-family: var(--sans);
    }

    .logout-icon-btn:hover { background: #FEE2E2; }

    .team-dropdown {
      display: none;
      position: absolute;
      top: 52px;
      right: 0;
      width: 320px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 14px;
      z-index: 150;
    }

    .team-dropdown.show { display: block; }

    .team-dropdown-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--label-gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 6px 10px;
    }

    .employee-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .employee-row:hover { background: #F1F8FA; }

    .employee-row-name { font-size: 13px; font-weight: 700; color: var(--navy); }
    .employee-row-role { font-size: 11px; color: var(--label-gray); }
    .employee-row-count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--teal-dark);
      background: #E5F8FA;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .employee-row-me { background: #F1F8FA; }

    .me-tag {
      display: inline-block;
      background: var(--teal);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      vertical-align: middle;
    }

    .team-dropdown-divider { height: 1px; background: var(--border-soft); margin: 10px 0; }

    .add-employee-form { display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 2px; }

    .add-employee-form input,
    .add-employee-form select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      font-size: 16px;
      font-family: var(--sans);
      background: #F8FBFE;
      color: var(--navy);
    }

    .add-employee-form input:focus,
    .add-employee-form select:focus { outline: none; border-color: var(--teal); background: white; }

    .add-employee-btn {
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--sans);
    }

    .add-employee-btn:hover { background: var(--teal-dark); }

    /* ===== EMPLOYEE PROFILE MODAL ===== */
    .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .profile-header .avatar-circle { width: 52px; height: 52px; font-size: 17px; cursor: default; }
    .profile-name { font-size: 19px; font-weight: 800; color: var(--navy); }
    .profile-role { font-size: 12px; color: var(--label-gray); }

    .profile-avatar-wrap {
      position: relative;
      width: 52px; height: 52px;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 50%;
    }

    .profile-avatar-wrap img,
    .profile-avatar-wrap .avatar-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(22,38,74,0.55);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .profile-avatar-wrap:hover .photo-overlay { opacity: 1; }

    .profile-edit-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border-soft);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 700;
      color: var(--navy);
      background: #F8FBFE;
    }

    .profile-edit-input:focus { outline: none; border-color: var(--teal); background: white; }
    .profile-edit-input:disabled { background: #EEF2F7; color: var(--label-gray); cursor: not-allowed; }

    select.profile-edit-input { font-weight: 500; font-size: 12px; color: var(--label-gray); }

    .dash-columns {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 55vh;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .dash-col-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .dash-col-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dash-col-count { color: var(--label-gray); font-weight: 500; font-size: 11px; }

    .dash-empty {
      font-size: 12px;
      color: var(--label-gray);
      font-style: italic;
      padding: 6px 0 0 17px;
    }

    .dash-task-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #F8FBFE;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--navy);
      cursor: pointer;
    }

    .dash-task-row:hover { border-color: var(--teal); }
    .dash-task-row .dash-task-date { margin-left: auto; font-size: 11px; color: var(--label-gray); }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .profile-stat {
      background: #F8FBFE;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .profile-stat-num { font-size: 20px; font-weight: 800; color: var(--navy); }
    .profile-stat-label { font-size: 10px; color: var(--label-gray); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

    .profile-task-list { display: flex; flex-direction: column; gap: 8px; }

    .profile-task-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #F8FBFE;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      cursor: pointer;
    }

    .profile-task-row:hover { border-color: var(--teal); }
    .profile-task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .profile-task-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--navy); }
    .profile-task-status { font-size: 10px; color: var(--label-gray); text-transform: uppercase; }

    .btn {
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--sans);
    }

    .btn-primary {
      background: var(--teal);
      color: white;
      padding: 12px 22px;
      box-shadow: 0 4px 12px rgba(20,184,198,0.35);
    }

    .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }

    .btn-save { background: var(--green); color: white; padding: 10px 20px; }
    .btn-cancel { background: #F1F5F9; color: var(--slate); padding: 10px 20px; }
    .btn-delete { background: #FEE2E2; color: var(--red); padding: 10px 20px; }
    .btn-approve { background: var(--green); color: white; padding: 8px 16px; }
    .btn-reject { background: var(--red); color: white; padding: 8px 16px; }
    .btn-small { padding: 7px 14px; font-size: 12px; }
    .btn-outline { background: #F1F5F9; color: var(--slate); padding: 7px 14px; }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }

    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stat-icon svg { width: 22px; height: 22px; }

    .stat-label {
      font-size: 11px;
      color: var(--label-gray);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-number {
      font-size: 34px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-caption { font-size: 12px; font-weight: 600; }
    .stat-caption.good { color: var(--good); }
    .stat-caption.bad { color: var(--bad); }

    /* ===== KANBAN BOARD ===== */
    .board {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      align-items: flex-start;
      padding-bottom: 12px;
    }

    .column {
      background: var(--card-bg);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      min-width: 270px;
      width: 270px;
      flex: 1 1 270px;
      padding: 18px;
      transition: flex-basis 0.2s ease, min-width 0.2s ease, width 0.2s ease;
    }

    .column.column-collapsed {
      flex: 0 0 120px;
      min-width: 120px;
      width: 120px;
      padding: 14px 10px;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .column-header span:first-child {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
    }

    .column.column-collapsed .column-header {
      flex-direction: row;
      white-space: nowrap;
      overflow: hidden;
    }

    .column.column-collapsed .column-header span:first-child {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .column-count {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .column-body { min-height: 80px; display: flex; flex-direction: column; gap: 12px; }
    .column.column-collapsed .column-body { display: none; }

    .column.drag-over {
      box-shadow: 0 0 0 2px var(--teal), var(--shadow-md);
      background: #F0FBFC;
    }

    /* Achievement Column */
    .column-achievement {
      flex: 0 0 100px;
      min-width: 100px;
      width: 100px;
      padding: 10px 8px;
      background: linear-gradient(135deg, #FEF3C7 0%, #FCD34D 100%);
      border: 2px solid #FBBF24;
      cursor: pointer;
    }

    .column-achievement .column-header {
      margin-bottom: 8px;
    }

    .achievement-header span {
      font-size: 14px !important;
    }

    .achievement-count {
      background: #D97706 !important;
      font-size: 11px !important;
      width: 20px !important;
      height: 20px !important;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show { display: flex; }

    .modal-content {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid #E4ECF7;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--navy);
      font-size: 22px;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--label-gray);
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-close:hover {
      color: var(--navy);
      background: #F3F4F6;
      border-radius: 8px;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .achievement-card {
      background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
      border-left: 4px solid #22C55E;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform 0.2s ease;
    }

    .achievement-card:hover {
      transform: translateX(4px);
    }

    .achievement-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .achievement-desc {
      font-size: 14px;
      color: var(--label-gray);
      margin-bottom: 8px;
    }

    .achievement-meta {
      font-size: 12px;
      color: var(--label-gray);
      font-style: italic;
    }

    /* ===== TASK CARDS ===== */
    .task-card {
      background: var(--card-bg);
      border-radius: 12px;
      border-left: 4px solid var(--slate);
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .task-card.dragging { opacity: 0.5; }
    .task-card[draggable="false"] { cursor: default; }
    .task-card[draggable="false"]:hover { transform: none; }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--navy);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-code { font-size: 11px; color: var(--label-gray); margin-bottom: 10px; }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-tagged {
      font-size: 11px;
      color: var(--label-gray);
      margin-bottom: 8px;
    }

    .card-date {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--slate);
    }

    .card-date.overdue { color: var(--bad); font-weight: 700; }
    .card-date svg { width: 13px; height: 13px; flex-shrink: 0; }

    .bar-icon { display: flex; align-items: flex-end; gap: 2px; height: 14px; }

      // Migration: runs ONCE ever (flagged), so it never reverts credentials you change later
      const alreadyMigrated = localStorage.getItem('teamtasks_creds_migrated');
      if (!alreadyMigrated) {
        let needsMigration = false;
        employees.forEach(e => {
          if (!e.username) { e.username = slugify(e.name); needsMigration = true; }
          if (!e.password) { e.password = '1234'; needsMigration = true; }
        });

        // Give the sole manager the friendly 'manager' login ID — but ONLY if their
        // current username still looks like the untouched auto-generated slug
        // (meaning they never deliberately customized it themselves)
        const mgrs = employees.filter(e => e.role === 'Manager');
        if (mgrs.length === 1) {
          const mgr = mgrs[0];
          const looksAutoGenerated = mgr.username === slugify(mgr.name);
          const takenByOther = employees.some(e => e.id !== mgr.id && e.username === 'manager');
          if (looksAutoGenerated && mgr.username !== 'manager' && !takenByOther) {
            mgr.username = 'manager';
            needsMigration = true;
          }
        }

        if (needsMigration || !savedEmp) persistEmployees();
        localStorage.setItem('teamtasks_creds_migrated', '1');
      } else {
        // Still backfill in the rare case an employee somehow has no credentials at all
        let needsBackfill = false;
        employees.forEach(e => {
          if (!e.username) { e.username = slugify(e.name); needsBackfill = true; }
          if (!e.password) { e.password = '1234'; needsBackfill = true; }
        });
        if (needsBackfill) persistEmployees();
      }

      const codes = tasks.map(t => t.code).filter(Boolean).map(c => parseInt(c.replace('T-', ''), 10)).filter(n => !isNaN(n));
      taskCounter = codes.length ? Math.max(...codes) : 100;
      renderAssignOptions();

      checkSession();
    }

    function slugify(name) {
      return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '');
    }

      if (savedUsername) {

          showApp();
          return;
        }

      showLogin();

    async function persist() {
      localStorage.setItem('teamtasks_data', JSON.stringify(tasks));
      
      // Also save to Supabase
      for (const task of tasks) {
        if (task.status !== 'achievement') {
          const { data: existing } = await supabase
            .from('tasks')
            .select('id')
            .eq('id', task.id);
          
          if (existing && existing.length > 0) {
            // Update existing task
            const { error: updateError } = await supabase
              .from('tasks')
              .update({
                title: task.name,
                description: task.desc,
                status: task.status,
                assigned_to: task.assigned,
                created_by: task.createdBy,
                deadline: task.deadline,
                urgency: task.urgency,
                tags: task.tagged,
                approval_status: task.approvalStatus || 'pending',
                updated_at: new Date().toISOString()
              })
              .eq('id', task.id);
            if (updateError) console.error('❌ Supabase task update failed for', task.name, ':', updateError.message);
          } else {
            // Insert new task
            const { error: insertError } = await supabase
              .from('tasks')
              .insert({
                id: task.id,
                title: task.name,
                description: task.desc,
                status: task.status,
                assigned_to: task.assigned,
                created_by: task.createdBy,
                deadline: task.deadline,
                urgency: task.urgency,
                tags: task.tagged,
                approval_status: task.approvalStatus || 'pending',
                code: task.code
              });
            if (insertError) console.error('❌ Supabase task insert failed for', task.name, ':', insertError.message);
          }
        }
      }
    }

    async function moveToAchievement(task) {
      // Always keep a local snapshot as a fallback (works even if Supabase blocks writes)
      const localAchievements = JSON.parse(localStorage.getItem('teamtasks_achievements') || '[]');
      localAchievements.unshift({
        task_id: task.id,
        name: task.name,
        desc: task.desc,
        urgency: task.urgency,
        completed_at: new Date().toISOString()
      });
      localStorage.setItem('teamtasks_achievements', JSON.stringify(localAchievements));

      // Also try to save to Supabase (best-effort)
      try {
        const { error } = await supabase
          .from('achievements')
          .insert({
            task_id: task.id,
            user_id: currentUser?.id || task.assigned,
            completed_at: new Date().toISOString()
          });
        if (error) {
          console.error('❌ Supabase achievements insert failed:', error.message);
          console.warn('Likely a Row-Level Security policy issue on the achievements table. Achievement was still saved locally.');
        }
      } catch (err) {
        console.error('❌ Error saving achievement to Supabase:', err);
      }
      
      // Remove the task row from Supabase's tasks table entirely so it
      // doesn't reappear on next load (its old status would otherwise
      // still match the "not achievement" filter used when loading tasks)
      try {
        const { error: deleteError } = await supabase
          .from('tasks')
          .delete()
          .eq('id', task.id);
        if (deleteError) {
          console.error('❌ Supabase task delete failed:', deleteError.message);
        }
      } catch (err) {
        console.error('❌ Error deleting task from Supabase:', err);
      }

      // Remove from main tasks array
      tasks = tasks.filter(t => t.id !== task.id);
      
      // Save changes
      await persist();
      render();
    }

    async function showAchievementsModal() {
      // Load local fallback achievements first (always available)
      const localAchievements = JSON.parse(localStorage.getItem('teamtasks_achievements') || '[]');

      // Try to also load from Supabase (best-effort)
      let achievedTasks = localAchievements.map(a => ({
        id: a.task_id,
        name: a.name || `Task #${a.task_id}`,
        desc: a.desc || '',
        completedAt: a.completed_at,
        urgency: a.urgency || 'medium'
      }));

      try {
        const { data: achievements, error } = await supabase
          .from('achievements')
          .select('task_id, completed_at')
          .order('completed_at', { ascending: false });
        
        if (error) {
          console.error('❌ Supabase achievements select failed:', error.message);
          console.warn('Showing locally-saved achievements only. This is likely a Row-Level Security policy issue.');
        } else if (achievements && achievements.length > 0) {
          // Merge Supabase results with local, de-duplicating by task_id
          const seen = new Set(achievedTasks.map(t => t.id));
          achievements.forEach(ach => {
            if (!seen.has(ach.task_id)) {
              const originalTask = tasks.find(t => t.id === ach.task_id);
              achievedTasks.push({
                id: ach.task_id,
                name: originalTask?.name || `Task #${ach.task_id}`,
                desc: originalTask?.desc || '',
                completedAt: ach.completed_at,
                urgency: originalTask?.urgency || 'medium'
              });
              seen.add(ach.task_id);
            }
          });
          achievedTasks.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
        }
      } catch (err) {
        console.error('❌ Error loading achievements from Supabase:', err);
      }
      
      // Show modal
      let modalHtml = `
        <div class="modal-overlay show" onclick="closeAchievementsModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h2>✨ Your Achievements</h2>
              <button class="btn-close" onclick="closeAchievementsModal()">✕</button>
            </div>
            <div class="modal-body" style="max-height: 500px; overflow-y: auto;">
              ${achievedTasks.length === 0 ? '<p>No achievements yet. Keep working! 🚀</p>' : ''}
              ${achievedTasks.map(task => `
                <div class="achievement-card">
                  <div class="achievement-title">${task.name}</div>
                  ${task.desc ? `<div class="achievement-desc">${task.desc}</div>` : ''}
                  <div class="achievement-meta">
                    <span>Completed: ${new Date(task.completedAt).toLocaleDateString()}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    async function addEmployee() {
      const nameInput = document.getElementById('newEmpName');
      const roleSelect = document.getElementById('newEmpRole');
      const idInput = document.getElementById('newEmpId');
      const passwordInput = document.getElementById('newEmpPassword');

      const name = nameInput.value.trim();
      if (!name) { alert('Please enter a name'); return; }
      if (employees.some(e => e.name.toLowerCase() === name.toLowerCase())) {
        alert('An employee with that name already exists');
        return;
      }

      let username = idInput.value.trim().toLowerCase() || slugify(name);
      if (employees.some(e => e.username.toLowerCase() === username)) {
        alert('That Login ID is already taken. Please choose another.');
        return;
      }
      const password = passwordInput.value.trim() || '1234';
      const email = username + '@teamtasks.com';

      // Save to Supabase
      const { data: inserted, error } = await supabase.from('users').insert({
        name: name,
        email: email,
        role: roleSelect.value,
        password: password
      }).select();

      if (error) {
        console.error('❌ Supabase insert failed:', error.message);
        console.warn('This is very likely a Supabase Row-Level Security (RLS) policy problem: RLS is enabled on the users table but no INSERT policy exists, so Supabase silently rejects the write for the anon key.');
        // Still add locally so the manager isn't blocked, using a local id
        employees.push({
          id: 'local-' + Date.now(),
          name, role: roleSelect.value, username, password
        });
        persistEmployees();
        renderEmployeeList();
        renderAssignOptions();
        alert(`⚠️ Employee "${name}" was added locally, but could NOT be saved to Supabase.\n\nReason: ${error.message}\n\nThis usually means Supabase's Row-Level Security policies are blocking writes. See the message from Claude for the SQL fix.`);
        return;
      }

      // Reload employees from Supabase
      const { data: reloaded } = await supabase.from('users').select('*');
      employees = reloaded.map(e => ({
        id: e.id,
        name: e.name,
        role: e.role || 'Employee',
        username: e.email?.split('@')[0] || e.name.toLowerCase(),
        password: e.password || '1234'
      }));
      persistEmployees();

      nameInput.value = '';
      roleSelect.value = 'Employee';
      idInput.value = '';
      passwordInput.value = '1234';
      empIdManuallyEdited = false;

      renderEmployeeList();
      renderAssignOptions();
      alert(`✅ Employee "${name}" added successfully!\nLogin ID: ${username}\nPassword: 1234`);
    }

    function renderAssignOptions() {
      const names = employees.map(e => e.name);
      const optsHtml = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

      if (assignedSelect) {

          assignedSelect.disabled = false;

          assignedSelect.innerHTML = optsHtml;
          if (names.includes(prevValue)) assignedSelect.value = prevValue;
          if (assignedHint) assignedHint.style.display = 'none';
        } else {
          // Employees can only assign tasks to themselves - only the manager assigns to others
          assignedSelect.innerHTML = `<option value="${esc(currentUser.name)}">${esc(currentUser.name)}</option>`;
          assignedSelect.value = currentUser.name;
          assignedSelect.disabled = true;
          if (assignedHint) assignedHint.style.display = 'block';
        }
      }
      if (taggedSelect) {
        const prevSelected = getMultiSelect('fTagged');
        taggedSelect.innerHTML = optsHtml;
        setMultiSelect('fTagged', prevSelected);
      }
    }

    function saveEmployeeProfile() {
      const emp = employees.find(e => e.id === editingEmployeeId);
      if (!emp) return;

      const newName = document.getElementById('profileNameInput').value.trim();
      if (!newName) { alert('Name cannot be empty'); return; }
      const newRole = document.getElementById('profileRoleInput').value;
      const newUsername = document.getElementById('profileUsernameInput').value.trim().toLowerCase();
      const newPassword = document.getElementById('profilePasswordInput').value.trim();

      if (!newUsername) { alert('Login ID cannot be empty'); return; }
      if (!newPassword) { alert('Password cannot be empty'); return; }
      if (employees.some(e => e.id !== emp.id && e.username.toLowerCase() === newUsername)) {
        alert('That Login ID is already taken by someone else.');
        return;
      }

      const oldName = emp.name;
      if (oldName !== newName) {
        tasks.forEach(t => {
          if (t.assigned === oldName) t.assigned = newName;
          if (t.tagged) t.tagged = t.tagged.map(n => n === oldName ? newName : n);
          if (t.createdBy === oldName) t.createdBy = newName;
        });
        persist();
      }

      const wasCurrentUser = currentUser && currentUser.id === emp.id;

      emp.name = newName;
      emp.role = newRole;
      emp.photo = tempProfilePhoto;
      emp.username = newUsername;
      emp.password = newPassword;
      persistEmployees();

      if (wasCurrentUser) {
        currentUser = emp;
        localStorage.setItem('teamtasks_session', emp.username);
        applyRoleUI();
      }

      renderAssignOptions();
      renderEmployeeList();
      render();
      closeEmployeeModal();
    }

    function deleteEmployeeProfile() {
      const emp = employees.find(e => e.id === editingEmployeeId);
      if (!emp) return;

      if (currentUser && currentUser.id === emp.id) {
        alert("You can't delete your own account while logged in as them.");
        return;
      }

      const assignedCount = tasks.filter(t => t.assigned === emp.name).length;
      const warning = assignedCount > 0
        ? `${emp.name} has ${assignedCount} task(s) assigned. Their name will stay on those tasks, but they'll be removed from your team list. Continue?`
        : `Delete ${emp.name}'s profile?`;
      if (!confirm(warning)) return;

      employees = employees.filter(e => e.id !== editingEmployeeId);
      persistEmployees();
      renderAssignOptions();
      renderEmployeeList();
      render();
      closeEmployeeModal();
    }

    function closeEmployeeModal() {
      document.getElementById('employeeModal').classList.remove('show');
      editingEmployeeId = null;
      tempProfilePhoto = null;
    }

    // ===== EMPLOYEE DASHBOARD (read-only, per person) =====
    function openEmployeeDashboard() {
      const emp = employees.find(e => e.id === editingEmployeeId);
      if (!emp) return;

      document.getElementById('dashAvatar').outerHTML = emp.photo
        ? `<img id="dashAvatar" src="${emp.photo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">`
        : `<div id="dashAvatar" class="avatar-circle" style="width:44px;height:44px;font-size:15px;background:${avatarColor(emp.name)}">${initials(emp.name)}</div>`;
      document.getElementById('dashName').textContent = emp.name;

      const empTasks = tasks.filter(t => t.assigned === emp.name);
      const container = document.getElementById('dashColumns');

      container.innerHTML = STATUSES.map(s => {
        const colTasks = empTasks.filter(t => t.status === s.key);
        const rows = colTasks.length === 0
          ? `<div class="dash-empty">Not currently working on anything here</div>`
          : colTasks.map(t => `
              <div class="dash-task-row" onclick="closeDashboardModal(); closeEmployeeModal(); openEditModal('${t.id}');">
                ${esc(t.name)}
                <span class="dash-task-date">${t.deadline ? formatDate(t.deadline) : ''}</span>
              </div>
            `).join('');

        return `
          <div>
            <div class="dash-col-header">
              <span class="dash-col-dot" style="background:${s.color}"></span>
              ${s.label} <span class="dash-col-count">(${colTasks.length})</span>
            </div>
            ${rows}
          </div>
        `;
      }).join('');

      document.getElementById('dashboardModal').classList.add('show');
    }

    function closeDashboardModal() {
      document.getElementById('dashboardModal').classList.remove('show');
    }


    function renderStats() {
      const vTasks = visibleTasks();
      const total = vTasks.length;
      const done = vTasks.filter(t => t.status === 'done').length;
      const inProgress = vTasks.filter(t => t.status === 'in-progress').length;
      const pendingApproval = vTasks.filter(t => t.status === 'approval' && (t.approvalStatus || 'pending') === 'pending').length;
      const overdue = vTasks.filter(t => t.deadline && t.deadline < today() && t.status !== 'done').length;

      const cards = [
        { icon: ICONS.total, label: 'Total Tasks', value: total, caption: `Across all statuses`, good: true },
        { icon: ICONS.inProgress, label: 'In Progress', value: inProgress, caption: inProgress ? `${inProgress} being worked on` : 'Nothing active', good: true },
        { icon: ICONS.done, label: 'Completed', value: done, caption: done ? `${done} finished` : 'None yet', good: true },
        { icon: ICONS.approval, label: 'Awaiting Approval', value: pendingApproval, caption: pendingApproval ? `Needs manager review` : 'All clear', good: !pendingApproval },
        { icon: ICONS.overdue, label: 'Overdue', value: overdue, caption: overdue ? `${overdue} need attention` : 'None, great job!', good: !overdue }
      ];

      document.getElementById('statsBar').innerHTML = cards.map(c => `
        <div class="stat-card">
          <div class="stat-icon">${c.icon}</div>
          <div class="stat-label">${c.label}</div>
          <div class="stat-number">${c.value}</div>
          <div class="stat-caption ${c.good ? 'good' : 'bad'}">${c.caption}</div>
        </div>
      `).join('');
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const vTasks = visibleTasks();

      STATUSES.forEach(s => {
        const colTasks = vTasks.filter(t => t.status === s.key);
        const isEmpty = colTasks.length === 0;
        const col = document.createElement('div');
        
        // Special handling for achievement column
        if (s.key === 'achievement') {
          const achievedCount = JSON.parse(localStorage.getItem('teamtasks_achievements') || '[]').length;
          col.className = 'column column-achievement column-collapsed';
          col.dataset.status = s.key;
          col.innerHTML = `
            <div class="column-header achievement-header">
              <span style="cursor: pointer; font-size: 18px;" onclick="showAchievementsModal()" title="Click to see achievements">${s.label}</span>
              <span class="column-count achievement-count">${achievedCount}</span>
            </div>
            <div class="column-body" data-status="${s.key}">
            </div>
          `;
        } else {
          col.className = 'column' + (isEmpty ? ' column-collapsed' : '');
          col.dataset.status = s.key;
          col.innerHTML = `
            <div class="column-header">
              <span>${s.label}</span>
              <span class="column-count">${colTasks.length}</span>
            </div>
            <div class="column-body" data-status="${s.key}">
              ${isEmpty ? '<div class="empty-hint">Drop tasks here</div>' : ''}
            </div>
          `;
        }

        const body = col.querySelector('.column-body');
        if (s.key !== 'achievement') {
          colTasks.forEach(t => body.appendChild(makeCard(t)));
        }

        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const id = e.dataTransfer.getData('text/plain');
          const task = tasks.find(t => String(t.id) === String(id));
          if (task && task.status !== s.key) {
            if (s.key === 'achievement') {
              // Move to achievements
              moveToAchievement(task);
            } else {
              task.status = s.key;
              if (s.key === 'approval' && !task.approvalStatus) {
                task.approvalStatus = 'pending';
              }
              persist();
              render();
            }
          }
        });

        board.appendChild(col);
      });
    }

    function urgencyBarIcon(urgency) {
      const level = urgency === 'high' ? 3 : urgency === 'medium' ? 2 : 1;
      const color = urgency === 'high' ? 'var(--red)' : urgency === 'medium' ? 'var(--orange)' : 'var(--green)';
      let bars = '';
      for (let i = 1; i <= 3; i++) {
        bars += `<span class="${i <= level ? 'fill' : ''}"></span>`;
      }
      return `<div class="bar-icon" style="color:${color}">${bars}</div>`;
    }

    function makeCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.style.borderLeftColor = STATUS_COLOR[task.status] || '#64748B';
      // Prevent approval cards from being dragged
      card.draggable = task.status !== 'approval';

      const isOverdue = task.deadline && task.deadline < today() && task.status !== 'done';
      const taggedHtml = task.tagged && task.tagged.length
        ? `<div class="card-tagged">🏷️ ${esc(task.tagged.join(', '))}</div>` : '';

      const voiceCount = (task.voiceNotes || []).filter(Boolean).length;
      const fileCount = (task.attachments || []).length;
      const iconsHtml = (voiceCount || fileCount)
        ? `<div class="card-icons">${voiceCount ? `🎙️ ${voiceCount}` : ''} ${fileCount ? `📎 ${fileCount}` : ''}</div>` : '';

      const approvalBadge = task.status === 'approval'
        ? `<span class="approval-badge ${task.approvalStatus || 'pending'}">${task.approvalStatus || 'pending'}</span>` : '';

      card.innerHTML = `
        ${approvalBadge}
        <div class="card-title">${esc(task.name)}</div>
        <div class="card-code">${esc(task.code || '')}</div>
        <div class="card-row">
          <div class="card-date ${isOverdue ? 'overdue' : ''}">${ICONS.calendar} ${task.deadline ? formatDate(task.deadline) : 'No date'}</div>
          ${avatarHTML(task.assigned || '?', 26, 10)}
        </div>
        <div class="card-row" style="margin-bottom:0;">
          ${taggedHtml || '<span></span>'}
          ${urgencyBarIcon(task.urgency)}
        </div>
        ${iconsHtml}
        <div class="card-creator">Created by ${esc(task.createdBy)}</div>
      `;

      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', task.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('click', () => openEditModal(task.id));

      return card;
    }

    function openAddModal() {
      editingId = null;
      tempVoiceNotes = [null, null];
      tempAttachments = [];
      tempApproval = 'pending';

      document.getElementById('modalTitle').textContent = 'New Task';
      document.getElementById('createdByInfo').style.display = 'none';
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('fName').value = '';
      document.getElementById('fDesc').value = '';
      renderAssignOptions();
      if (currentUser && currentUser.role === 'Manager') {
        document.getElementById('fAssigned').value = currentUser.name;
      }
      clearMultiSelect('fTagged');
      document.getElementById('fDeadline').value = '';
      document.getElementById('fUrgency').value = 'medium';
      document.getElementById('fStatus').value = 'todo';

      renderVoiceSlots();
      renderAttachments();
      onStatusChange();
      document.getElementById('taskModal').classList.add('show');
    }

    function openEditModal(id) {
      const task = tasks.find(t => String(t.id) === String(id));
      if (!task) return;
      editingId = id;
      tempVoiceNotes = (task.voiceNotes && task.voiceNotes.length === 2) ? [...task.voiceNotes] : [null, null];
      tempAttachments = task.attachments ? [...task.attachments] : [];
      tempApproval = task.approvalStatus || 'pending';

      document.getElementById('modalTitle').textContent = 'Edit Task';
      const info = document.getElementById('createdByInfo');
      info.style.display = 'block';
      info.textContent = `${task.code || ''} — Created by: ${task.createdBy}`;
      document.getElementById('deleteBtn').style.display = 'inline-block';
      document.getElementById('fName').value = task.name;
      document.getElementById('fDesc').value = task.desc || '';

      const isManager = currentUser && currentUser.role === 'Manager';
      const assignedSelect = document.getElementById('fAssigned');
      const assignedHint = document.getElementById('assignedHint');
      if (isManager) {
        renderAssignOptions();
        assignedSelect.value = task.assigned;
      } else {
        // Employees see who it's really assigned to, but can't change it
        assignedSelect.innerHTML = `<option value="${esc(task.assigned)}">${esc(task.assigned)}</option>`;
        assignedSelect.value = task.assigned;
        assignedSelect.disabled = true;
        if (assignedHint) assignedHint.style.display = 'block';
      }

      setMultiSelect('fTagged', task.tagged || []);
      document.getElementById('fDeadline').value = task.deadline || '';
      document.getElementById('fUrgency').value = task.urgency;
      document.getElementById('fStatus').value = task.status;

      renderVoiceSlots();
      renderAttachments();
      onStatusChange();
      document.getElementById('taskModal').classList.add('show');
    }

    function closeModal() {
      stopRecordingIfActive();
      document.getElementById('taskModal').classList.remove('show');
      editingId = null;
    }

    function saveTask() {
      const name = document.getElementById('fName').value.trim();
      if (!name) { alert('Please enter a task name'); return; }

      const status = document.getElementById('fStatus').value;

      const data = {
        name,
        desc: document.getElementById('fDesc').value.trim(),
        assigned: document.getElementById('fAssigned').value,
        tagged: getMultiSelect('fTagged'),
        deadline: document.getElementById('fDeadline').value,
        urgency: document.getElementById('fUrgency').value,
        status,
        voiceNotes: tempVoiceNotes,
        attachments: tempAttachments
      };

      if (status === 'approval') {
        data.approvalStatus = tempApproval || 'pending';
      }

      if (editingId) {
        const task = tasks.find(t => String(t.id) === String(editingId));
        Object.assign(task, data);
      } else {
        taskCounter++;
        const newId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
        tasks.push({ id: newId, code: 'T-' + taskCounter, createdBy: currentUser ? currentUser.name : 'Manager Admin', ...data });
      }

      persist();
      render();
      closeModal();
    }

    function deleteTask() {
      if (!editingId) return;
      if (!confirm('Delete this task?')) return;
      tasks = tasks.filter(t => t.id !== editingId);
      persist();
      render();
      closeModal();
    }

    function onStatusChange() {
      const status = document.getElementById('fStatus').value;
      const section = document.getElementById('approvalSection');
      if (status === 'approval') {
        section.classList.add('show');
        updateApprovalUI();
      } else {
        section.classList.remove('show');
      }
    }

    function setApproval(value) {
      tempApproval = value;
      updateApprovalUI();
    }

    function updateApprovalUI() {
      const dot = document.getElementById('approvalDot');
      const text = document.getElementById('approvalStatusText');
      const section = document.getElementById('approvalSection');
      
      dot.className = `status-dot ${tempApproval}`;
      text.textContent = tempApproval.charAt(0).toUpperCase() + tempApproval.slice(1);
      
      // Update section background color based on approval status
      section.classList.remove('pending-status', 'approved-status', 'rejected-status');
      section.classList.add(`${tempApproval}-status`);
    }

    function renderVoiceSlots() {
      for (let i = 0; i < 2; i++) {
        const container = document.getElementById('voiceSlot' + i);
        const note = tempVoiceNotes[i];

        if (note) {
          container.innerHTML = `
            <div class="voice-slot">
              <span>🎙️ Note ${i + 1}</span>
              <audio controls src="${note}"></audio>
              <button type="button" class="voice-remove" onclick="removeVoiceNote(${i})" title="Delete">🗑️</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="voice-slot">
              <button type="button" class="rec-btn" id="recBtn${i}" onclick="toggleRecording(${i})" title="Record">🎤</button>
              <span class="voice-empty">Voice note ${i + 1} — not recorded</span>
            </div>
          `;
        }
      }
    }

    async function toggleRecording(slot) {
      if (recordingSlot === slot) {
        mediaRecorder.stop();
        return;
      }
      if (recordingSlot !== null) {
        alert('Please stop the current recording first.');
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        recordingSlot = slot;

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            tempVoiceNotes[slot] = reader.result;
            renderVoiceSlots();
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
          recordingSlot = null;
        };

        mediaRecorder.start();
        const btn = document.getElementById('recBtn' + slot);
        if (btn) { btn.classList.add('recording'); btn.textContent = '⏹️'; }
      } catch (err) {
        alert('Microphone access denied or unavailable: ' + err.message);
        recordingSlot = null;
      }
    }

    function stopRecordingIfActive() {
      if (mediaRecorder && recordingSlot !== null) {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      recordingSlot = null;
    }

    function removeVoiceNote(slot) {
      tempVoiceNotes[slot] = null;
      renderVoiceSlots();
    }

    function handleFiles(fileList) {
      const files = Array.from(fileList);
      const remaining = 4 - tempAttachments.length;

      if (remaining <= 0) {
        alert('Maximum 4 attachments allowed.');
        document.getElementById('fileInput').value = '';
        return;
      }

      const toAdd = files.slice(0, remaining);
      if (files.length > remaining) {
        alert(`Only ${remaining} more file(s) can be added (max 4 total).`);
      }

      let loaded = 0;
      toAdd.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          tempAttachments.push({
            name: file.name,
            type: file.type,
            data: reader.result
          });
          loaded++;
          if (loaded === toAdd.length) {
            renderAttachments();
          }
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('fileInput').value = '';
    }

    function removeAttachment(index) {
      tempAttachments.splice(index, 1);
      renderAttachments();
    }

    function renderAttachments() {
      document.getElementById('attachCount').textContent = tempAttachments.length;
      const list = document.getElementById('attachList');
      list.innerHTML = '';

      tempAttachments.forEach((att, i) => {
        const item = document.createElement('div');
        item.className = 'attach-item';

        const isImage = att.type && att.type.startsWith('image/');
        const icon = isImage
          ? `<img class="attach-thumb" src="${att.data}">`
          : `<div class="attach-icon">${fileIcon(att.type)}</div>`;

        item.innerHTML = `
          ${icon}
          <span class="attach-name">${esc(att.name)}</span>
          <button type="button" class="attach-remove" onclick="removeAttachment(${i})" title="Remove">🗑️</button>
        `;
        item.querySelector('.attach-name').addEventListener('click', () => {
          window.open(att.data, '_blank');
        });
        list.appendChild(item);
      });
    }

    function fileIcon(type) {
      if (!type) return '📄';
      if (type.startsWith('video/')) return '🎬';
      if (type.includes('pdf')) return '📕';
      if (type.includes('word') || type.includes('doc')) return '📝';
      return '📄';
    }

    function today() {
      return new Date().toISOString().split('T')[0];
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function getMultiSelect(id) {
      return Array.from(document.getElementById(id).selectedOptions).map(o => o.value);
    }

    function setMultiSelect(id, values) {
      Array.from(document.getElementById(id).options).forEach(o => {
        o.selected = values.includes(o.value);
      });
    }

    function clearMultiSelect(id) {
      Array.from(document.getElementById(id).options).forEach(o => o.selected = false);
    }

    document.getElementById('taskModal').addEventListener('click', e => {
      if (e.target.id === 'taskModal') closeModal();
    });

    document.getElementById('employeeModal').addEventListener('click', e => {
      if (e.target.id === 'employeeModal') closeEmployeeModal();
    });

    document.getElementById('dashboardModal').addEventListener('click', e => {
      if (e.target.id === 'dashboardModal') closeDashboardModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeModal(); closeDashboardModal(); closeEmployeeModal(); }
    });

    document.getElementById('loginUsername').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginPassword').focus();
    });
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLoginSubmit();
    });

    // Only show login initially - init() will be called AFTER successful login
    renderDashboard();
  </script>
</body>
</html>
